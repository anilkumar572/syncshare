name: Deploy Web and Firestore Rules

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Node dependencies
        run: npm install

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --no-wasm-dry-run

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHARESYNC_56711 }}
          channelId: live
          projectId: sharesync-56711

      - name: Authenticate for Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT_SHARESYNC_56711: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHARESYNC_56711 }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_SHARESYNC_56711" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Show Firestore rules deploy identity
        env:
          FIREBASE_SERVICE_ACCOUNT_SHARESYNC_56711: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHARESYNC_56711 }}
        run: node scripts/print-firebase-deploy-identity.js --iam-help

      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT_SHARESYNC_56711: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHARESYNC_56711 }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [[ -n "${FIREBASE_TOKEN:-}" ]]; then
            echo "Deploying Firestore rules with FIREBASE_TOKEN (user CI token)..."
            ./node_modules/.bin/firebase deploy --only firestore:rules --token "$FIREBASE_TOKEN"
          else
            npm run deploy:rules
          fi

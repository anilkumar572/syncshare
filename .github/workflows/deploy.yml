name: Deploy Web and Firestore Rules

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Node dependencies
        run: npm install

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --no-wasm-dry-run

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHARESYNC_56711 }}
          channelId: live
          projectId: sharesync-56711

      - name: Authenticate for Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT_SHARESYNC_56711: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHARESYNC_56711 }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_SHARESYNC_56711" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Firestore rules
        id: firestore_rules
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_SHARESYNC_56711: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHARESYNC_56711 }}
        run: npm run deploy:rules

      - name: Firestore rules permission notice
        if: steps.firestore_rules.outcome == 'failure'
        run: |
          echo "::warning::Firestore rules deploy failed (403 permission denied)."
          echo "Add Firebase Rules Admin role to your service account:"
          echo "https://console.cloud.google.com/iam-admin/iam?project=sharesync-56711"
          echo "Or publish firestore.rules manually:"
          echo "https://console.firebase.google.com/project/sharesync-56711/firestore/rules"
